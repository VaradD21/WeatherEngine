spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: never
  cache:
    type: none

management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    secret: weatherengine-dev-secret-key-must-be-at-least-32-bytes-long
    expiration-ms: 86400000
  cors:
    allowed-origins: ""
  weather-providers:
    open-meteo:
      forecast-url: https://api.open-meteo.com/v1/forecast
      air-quality-url: https://air-quality-api.open-meteo.com/v1/air-quality
    weather-api:
      key: ""
      url: https://api.weatherapi.com/v1/forecast.json
    free-open-api:
      url: https://freeopenapi.dev/api/v1/weather
