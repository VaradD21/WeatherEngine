services:
  - type: web
    name: weatherengine-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    branch: backend
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: weatherengine-db
          property: jdbcConnectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: weatherengine-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: weatherengine-db
          property: password
      - key: SPRING_DATA_REDIS_URL
        fromService:
          type: redis
          name: weatherengine-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: SQL_INIT_MODE
        value: always

databases:
  - name: weatherengine-db
    plan: free
    databaseName: weatherengine
    user: postgres
    region: oregon
