spring:
  application:
    name: weatherengine-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:weatherengine}}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate # schema.sql is the source of truth, not Hibernate auto-generation
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  cache:
    type: ${SPRING_CACHE_TYPE:redis}
    redis:
      time-to-live: 900000 # 15 min, matches the caching strategy in the project plan

  sql:
    init:
      mode: ${SQL_INIT_MODE:always}
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:weatherengine-dev-secret-key-must-be-at-least-32-bytes-long}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24h

  cors:
    allowed-origins: ${ALLOWED_ORIGINS:}

  weather-providers:
    open-meteo:
      forecast-url: ${OPEN_METEO_FORECAST_URL:https://api.open-meteo.com/v1/forecast}
      air-quality-url: ${OPEN_METEO_AIR_QUALITY_URL:https://air-quality-api.open-meteo.com/v1/air-quality}
    weather-api:
      key: ${WEATHERAPI_KEY:}
      url: ${WEATHERAPI_URL:https://api.weatherapi.com/v1/forecast.json}
    free-open-api:
      url: ${FREEOPENAPI_BASE_URL:https://freeopenapi.dev/api/v1/weather}

logging:
  level:
    com.weatherengine: DEBUG
